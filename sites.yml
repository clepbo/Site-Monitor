# ------------------------------------------------------------
#  Sites to monitor
#  Add as many as you like. Each site gets its own alert emails.
# ------------------------------------------------------------

settings:
  timeout_seconds: 15        # how long to wait before calling a site "down"
  retries: 2                 # re-check this many times before alerting (avoids false alarms)
  remind_every_hours: 6      # while a site stays down, re-send an alert this often (0 = never)

sites:
  - name: Teasoo Consulting
    url: https://teasooconsulting.com/
    emails:
      - israel.oni@teasooconsulting.com
      - efeosasere.okoro@teasooconsulting.com

  - name: Esangbedo Humanitarian Foundation (EHF)
    url: https://ehfoundation.africa/
    emails:
      - israel.oni@teasooconsulting.com
      - efeosasere.okoro@teasooconsulting.com
    # Optional extras:
    # expected_status: 200          # default: any 2xx or 3xx counts as up
    # must_contain: "Welcome"       # page must contain this text, catches "blank page" failures

  - name: Moatview Apartments
    url: https://moatviewapartments.com/
    emails:
      - israel.oni@teasooconsulting.com
      - efeosasere.okoro@teasooconsulting.com
